[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-svs-backend"
version = "0.1.0"
description = "Local synthesis API for mini-svs"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.116,<1",
  "librosa>=0.11,<1",
  "numpy>=2,<3",
  "pydantic>=2.11,<3",
  "pyrubberband>=0.4,<1",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
  "soundfile>=0.13,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]
instruments = [
  "pretty-midi>=0.2.10,<1",
  "pyfluidsynth>=1.3,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
